<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>مشتریان | پنل فروشگاهی</title>
    <link rel="stylesheet" href="../src/input.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@100..900&display=swap"
      rel="stylesheet"
    />
    <script type="module" src="../src/customers.js"></script>
  </head>

  <body
    x-data="customersPage"
    x-init="init()"
    class="min-h-screen bg-[#17131d] font-['Vazirmatn'] text-white"
    :class="theme === 'light' ? 'bg-gray-100 text-gray-900' : 'bg-[#17131d] text-white'"
  >
    <div class="min-h-screen lg:flex">
      <aside
        class="w-full shrink-0 bg-[#1d1725] p-5 lg:fixed lg:right-0 lg:top-0 lg:h-screen lg:w-64"
        :class="theme === 'light' ? 'bg-white border-l border-gray-200' : 'bg-[#1d1725]'"
      >
        <a
          href="../index.html"
          class="mb-6 flex items-center gap-3 text-xl font-black"
        >
          <span
            class="flex h-11 w-11 items-center justify-center rounded-xl bg-[#4f8a67]"
            >S</span
          >
          پنل فروشگاهی
        </a>

        <nav class="flex gap-2 overflow-x-auto lg:flex-col">
          <a
            href="../index.html"
            class="shrink-0 rounded-xl px-4 py-3 text-sm text-gray-400 hover:bg-white/5"
            >داشبورد</a
          >
          <a
            href="products.html"
            class="shrink-0 rounded-xl px-4 py-3 text-sm text-gray-400 hover:bg-white/5"
            >محصولات</a
          >
          <a
            href="orders.html"
            class="shrink-0 rounded-xl px-4 py-3 text-sm text-gray-400 hover:bg-white/5"
            >سفارش‌ها</a
          >
          <a
            href="customers.html"
            class="shrink-0 rounded-xl bg-[#4f8a67] px-4 py-3 text-sm font-bold text-white"
            >مشتریان</a
          >
          <a
            href="reports.html"
            class="shrink-0 rounded-xl px-4 py-3 text-sm text-gray-400 hover:bg-white/5"
            >گزارش‌ها</a
          >
          <a
            href="settings.html"
            class="shrink-0 rounded-xl px-4 py-3 text-sm text-gray-400 hover:bg-white/5"
            >تنظیمات</a
          >
        </nav>

        <button
          type="button"
          @click="toggleTheme()"
          class="mt-5 w-full rounded-xl border border-white/10 px-4 py-3 text-sm"
          x-text="theme === 'dark' ? '☀️ حالت روشن' : '🌙 حالت تاریک'"
        ></button>
      </aside>

      <main class="min-w-0 flex-1 p-4 sm:p-6 lg:mr-64 lg:p-8">
        <header
          class="mb-8 flex flex-col gap-4 sm:flex-row sm:items-center sm:justify-between"
        >
          <div>
            <h1 class="text-2xl font-black sm:text-3xl">مدیریت مشتریان</h1>
            <p class="mt-2 text-sm text-gray-400">
              مشاهده و مدیریت اطلاعات مشتریان فروشگاه
            </p>
          </div>

          <button
            type="button"
            @click="openAddModal()"
            class="rounded-xl bg-[#4f8a67] px-5 py-3 text-sm font-bold text-white hover:bg-[#3d7053]"
          >
            + افزودن مشتری
          </button>
        </header>

        <section class="mb-6 grid gap-4 sm:grid-cols-3">
          <article
            class="rounded-2xl border border-white/5 bg-[#211b2a] p-5"
            :class="theme === 'light' ? 'border-gray-200 bg-white' : 'bg-[#211b2a]'"
          >
            <p class="text-sm text-gray-400">کل مشتریان</p>
            <p class="mt-3 text-3xl font-black" x-text="customers.length"></p>
          </article>

          <article
            class="rounded-2xl border border-white/5 bg-[#211b2a] p-5"
            :class="theme === 'light' ? 'border-gray-200 bg-white' : 'bg-[#211b2a]'"
          >
            <p class="text-sm text-gray-400">مشتریان فعال</p>
            <p
              class="mt-3 text-3xl font-black text-emerald-400"
              x-text="customers.filter(c => c.status === 'active').length"
            ></p>
          </article>

          <article
            class="rounded-2xl border border-white/5 bg-[#211b2a] p-5"
            :class="theme === 'light' ? 'border-gray-200 bg-white' : 'bg-[#211b2a]'"
          >
            <p class="text-sm text-gray-400">مشتریان غیرفعال</p>
            <p
              class="mt-3 text-3xl font-black text-amber-400"
              x-text="customers.filter(c => c.status === 'inactive').length"
            ></p>
          </article>
        </section>

        <section
          class="mb-5 flex flex-col gap-3 rounded-2xl border border-white/5 bg-[#211b2a] p-4 sm:flex-row"
          :class="theme === 'light' ? 'border-gray-200 bg-white' : 'bg-[#211b2a]'"
        >
          <input
            type="search"
            x-model="search"
            placeholder="جست‌وجوی نام، شماره موبایل یا ایمیل..."
            class="min-w-0 flex-1 rounded-xl border border-white/10 bg-[#17131d] px-4 py-3 text-sm text-white outline-none focus:border-[#4f8a67]"
            :class="theme === 'light' ? 'border-gray-200 bg-gray-50 text-gray-900' : 'bg-[#17131d] text-white'"
          />

          <select
            x-model="statusFilter"
            class="rounded-xl border border-white/10 bg-[#17131d] px-4 py-3 text-sm text-white outline-none"
            :class="theme === 'light' ? 'border-gray-200 bg-gray-50 text-gray-900' : 'bg-[#17131d] text-white'"
          >
            <option value="all">همه مشتریان</option>
            <option value="active">فعال</option>
            <option value="inactive">غیرفعال</option>
          </select>
        </section>

        <section
          class="overflow-hidden rounded-2xl border border-white/5 bg-[#211b2a]"
          :class="theme === 'light' ? 'border-gray-200 bg-white' : 'bg-[#211b2a]'"
        >
          <div class="overflow-x-auto">
            <table class="w-full min-w-[850px] text-right text-sm">
              <thead
                class="bg-white/5 text-gray-400"
                :class="theme === 'light' ? 'bg-gray-50' : 'bg-white/5'"
              >
                <tr>
                  <th class="px-5 py-4 font-medium">نام مشتری</th>
                  <th class="px-5 py-4 font-medium">شماره موبایل</th>
                  <th class="px-5 py-4 font-medium">ایمیل</th>
                  <th class="px-5 py-4 font-medium">سفارش‌ها</th>
                  <th class="px-5 py-4 font-medium">وضعیت</th>
                  <th class="px-5 py-4 font-medium">عملیات</th>
                </tr>
              </thead>

              <tbody class="divide-y divide-white/5">
                <template
                  x-for="customer in filteredCustomers"
                  :key="customer.id"
                >
                  <tr class="hover:bg-white/[0.03]">
                    <td class="px-5 py-4">
                      <div class="flex items-center gap-3">
                        <span
                          class="flex h-10 w-10 shrink-0 items-center justify-center rounded-full bg-[#4f8a67]/20 font-bold text-[#86c69b]"
                          x-text="customer.name.charAt(0)"
                        ></span>
                        <span class="font-bold" x-text="customer.name"></span>
                      </div>
                    </td>

                    <td
                      class="px-5 py-4 text-gray-400"
                      x-text="customer.phone"
                    ></td>
                    <td
                      class="px-5 py-4 text-gray-400"
                      x-text="customer.email || '—'"
                    ></td>
                    <td class="px-5 py-4" x-text="customer.orders"></td>

                    <td class="px-5 py-4">
                      <span
                        class="rounded-full px-3 py-1 text-xs font-bold"
                        :class="customer.status === 'active'
                        ? 'bg-emerald-500/15 text-emerald-400'
                        : 'bg-amber-500/15 text-amber-400'"
                        x-text="customer.status === 'active' ? 'فعال' : 'غیرفعال'"
                      ></span>
                    </td>

                    <td class="px-5 py-4">
                      <div class="flex gap-2">
                        <button
                          type="button"
                          @click="editCustomer(customer)"
                          class="rounded-lg bg-blue-500/10 px-3 py-2 text-xs font-bold text-blue-400"
                        >
                          ویرایش
                        </button>

                        <button
                          type="button"
                          @click="deleteCustomer(customer.id)"
                          class="rounded-lg bg-red-500/10 px-3 py-2 text-xs font-bold text-red-400"
                        >
                          حذف
                        </button>
                      </div>
                    </td>
                  </tr>
                </template>

                <tr x-show="filteredCustomers.length === 0">
                  <td colspan="6" class="px-5 py-12 text-center text-gray-400">
                    مشتری‌ای پیدا نشد.
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </section>

        <p class="mt-4 text-xs text-gray-500">
          اطلاعات این صفحه در مرورگر فعلی ذخیره می‌شود.
        </p>
      </main>
    </div>

    <!-- پنجره مشتری؛ در شروع حتماً مخفی است -->
    <div
      x-show="modalOpen"
      style="display: none"
      @click.self="closeModal()"
      @keydown.escape.window="closeModal()"
      class="fixed inset-0 z-50 flex items-center justify-center overflow-y-auto bg-black/70 p-4"
    >
      <section
        class="my-auto w-full max-w-lg rounded-2xl border border-white/10 bg-[#211b2a] p-6 text-white shadow-2xl"
        :class="theme === 'light' ? 'border-gray-200 bg-white text-gray-900' : 'bg-[#211b2a] text-white'"
      >
        <h2
          class="mb-5 text-xl font-black"
          x-text="editingId === null ? 'افزودن مشتری جدید' : 'ویرایش مشتری'"
        ></h2>

        <form @submit.prevent="saveCustomer()" class="space-y-4">
          <div>
            <label class="mb-2 block text-sm">نام و نام خانوادگی *</label>
            <input
              type="text"
              required
              x-model.trim="form.name"
              class="w-full rounded-xl border border-white/10 bg-[#17131d] px-4 py-3 text-sm text-white outline-none focus:border-[#4f8a67]"
              :class="theme === 'light' ? 'border-gray-200 bg-gray-50 text-gray-900' : 'bg-[#17131d] text-white'"
            />
          </div>

          <div>
            <label class="mb-2 block text-sm">شماره موبایل *</label>
            <input
              type="tel"
              required
              x-model.trim="form.phone"
              class="w-full rounded-xl border border-white/10 bg-[#17131d] px-4 py-3 text-sm text-white outline-none focus:border-[#4f8a67]"
              :class="theme === 'light' ? 'border-gray-200 bg-gray-50 text-gray-900' : 'bg-[#17131d] text-white'"
            />
          </div>

          <div>
            <label class="mb-2 block text-sm">ایمیل</label>
            <input
              type="email"
              x-model.trim="form.email"
              class="w-full rounded-xl border border-white/10 bg-[#17131d] px-4 py-3 text-sm text-white outline-none focus:border-[#4f8a67]"
              :class="theme === 'light' ? 'border-gray-200 bg-gray-50 text-gray-900' : 'bg-[#17131d] text-white'"
            />
          </div>

          <div>
            <label class="mb-2 block text-sm">وضعیت مشتری</label>
            <select
              x-model="form.status"
              class="w-full rounded-xl border border-white/10 bg-[#17131d] px-4 py-3 text-sm text-white outline-none"
              :class="theme === 'light' ? 'border-gray-200 bg-gray-50 text-gray-900' : 'bg-[#17131d] text-white'"
            >
              <option value="active">فعال</option>
              <option value="inactive">غیرفعال</option>
            </select>
          </div>

          <div class="flex flex-col-reverse gap-3 pt-2 sm:flex-row">
            <button
              type="button"
              @click="closeModal()"
              class="flex-1 rounded-xl border border-white/10 px-4 py-3 text-sm"
            >
              انصراف
            </button>

            <button
              type="submit"
              class="flex-1 rounded-xl bg-[#4f8a67] px-4 py-3 text-sm font-bold text-white hover:bg-[#3d7053]"
            >
              ذخیره مشتری
            </button>
          </div>
        </form>
      </section>
    </div>

    <!-- پیام موفقیت -->
    <div
      x-show="toast"
      style="display: none"
      x-transition.opacity
      class="fixed bottom-5 left-5 z-[60] rounded-xl bg-[#4f8a67] px-5 py-3 text-sm font-bold text-white shadow-xl"
      x-text="toast"
    ></div>
  </body>
</html>
