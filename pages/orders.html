<!doctype html>
<html lang="fa" dir="rtl" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>سفارش‌ها | داشبورد فروشگاهی</title>

    <script>
      (() => {
        const theme = localStorage.getItem("theme") || "dark";
        document.documentElement.classList.toggle("dark", theme === "dark");
        document.documentElement.classList.toggle("light", theme === "light");
      })();
    </script>

    <link rel="stylesheet" href="../src/input.css" />
    <script type="module" src="../src/orders.js"></script>
  </head>

  <body
    x-data="ordersPage"
    x-init="init()"
    class="min-h-screen bg-[#f5f6f8] text-[#25212b] transition-colors dark:bg-[#17131d] dark:text-[#f5f2f7]"
  >
    <div>
      <div
        x-show="sidebarOpen"
        @click="sidebarOpen = false"
        class="fixed inset-0 z-40 bg-black/60 lg:hidden"
      ></div>

      <aside
        :class="sidebarOpen ? 'translate-x-0' : 'translate-x-full'"
        class="fixed right-0 top-0 z-50 flex h-screen w-64 flex-col border-l border-gray-200 bg-white transition-transform duration-300 dark:border-white/10 dark:bg-[#1d1725] lg:translate-x-0"
      >
        <div
          class="flex h-20 items-center justify-between border-b border-gray-200 px-5 dark:border-white/10"
        >
          <a
            href="../index.html"
            class="text-2xl font-black text-[#4f8a67] dark:text-[#86c69b]"
          >
            فروشگاه من
          </a>
          <button
            @click="sidebarOpen = false"
            class="rounded-xl bg-gray-100 p-2 dark:bg-white/5 lg:hidden"
            aria-label="بستن منو"
          >
            ✕
          </button>
        </div>

        <nav class="space-y-2 p-4">
          <a
            href="../index.html"
            class="flex gap-3 rounded-xl px-4 py-3 text-gray-600 hover:bg-gray-100 dark:text-gray-300 dark:hover:bg-white/5"
          >
            <span>🏠</span><span>داشبورد</span>
          </a>
          <a
            href="./products.html"
            class="flex gap-3 rounded-xl px-4 py-3 text-gray-600 hover:bg-gray-100 dark:text-gray-300 dark:hover:bg-white/5"
          >
            <span>📦</span><span>محصولات</span>
          </a>
          <a
            href="./orders.html"
            class="flex gap-3 rounded-xl bg-[#4f8a67]/10 px-4 py-3 font-semibold text-[#4f8a67] dark:text-[#86c69b]"
          >
            <span>🛒</span><span>سفارش‌ها</span>
          </a>
          <a
            href="./customers.html"
            class="flex gap-3 rounded-xl px-4 py-3 text-gray-600 hover:bg-gray-100 dark:text-gray-300 dark:hover:bg-white/5"
          >
            <span>👥</span><span>مشتریان</span>
          </a>
          <a
            href="./reports.html"
            class="flex gap-3 rounded-xl px-4 py-3 text-gray-600 hover:bg-gray-100 dark:text-gray-300 dark:hover:bg-white/5"
          >
            <span>📊</span><span>گزارش‌ها</span>
          </a>
          <a
            href="./settings.html"
            class="flex gap-3 rounded-xl px-4 py-3 text-gray-600 hover:bg-gray-100 dark:text-gray-300 dark:hover:bg-white/5"
          >
            <span>⚙️</span><span>تنظیمات</span>
          </a>
        </nav>

        <div class="mt-auto border-t border-gray-200 p-4 dark:border-white/10">
          <button
            @click="toggleTheme()"
            class="flex w-full items-center justify-between rounded-xl bg-gray-100 px-4 py-3 text-sm dark:bg-white/5"
          >
            <span x-text="dark ? 'حالت روشن' : 'حالت تاریک'"></span>
            <span x-text="dark ? '☀️' : '🌙'"></span>
          </button>
        </div>
      </aside>

      <main class="min-h-screen lg:mr-64">
        <header
          class="sticky top-0 z-30 flex min-h-16 items-center justify-between border-b border-gray-200 bg-white/90 px-3 py-3 backdrop-blur-xl dark:border-white/10 dark:bg-[#1d1725]/90 sm:px-6 lg:min-h-20 lg:px-8"
        >
          <div class="flex items-center gap-3">
            <button
              @click="sidebarOpen = true"
              class="rounded-xl bg-gray-100 p-2 dark:bg-white/5 lg:hidden"
              aria-label="باز کردن منو"
            >
              ☰
            </button>
            <div>
              <h1 class="text-lg font-black sm:text-xl">سفارش‌ها</h1>
              <p
                class="mt-1 hidden text-sm text-gray-500 dark:text-gray-400 sm:block"
              >
                مدیریت سفارش‌های فروشگاه
              </p>
            </div>
          </div>

          <button
            @click="toggleTheme()"
            class="rounded-xl bg-gray-100 px-3 py-2 text-sm dark:bg-white/5"
          >
            <span x-text="dark ? '☀️' : '🌙'"></span>
          </button>
        </header>

        <section class="p-3 pt-6 sm:p-6 lg:p-8">
          <div
            class="mb-6 flex flex-col justify-between gap-3 sm:flex-row sm:items-center"
          >
            <div>
              <h2 class="text-xl font-black sm:text-2xl">لیست سفارش‌ها</h2>
              <p class="mt-2 text-sm text-gray-500 dark:text-gray-400">
                بررسی، جستجو و تغییر وضعیت سفارش‌ها
              </p>
            </div>
          </div>

          <div
            class="mb-6 grid grid-cols-1 gap-4 sm:grid-cols-2 xl:grid-cols-3"
          >
            <div
              class="rounded-2xl border border-gray-200 bg-white p-5 dark:border-white/5 dark:bg-[#211b2a]"
            >
              <p class="text-sm text-gray-500 dark:text-gray-400">
                کل سفارش‌ها
              </p>
              <p
                class="mt-3 text-2xl font-black"
                x-text="orders.length.toLocaleString('fa-IR')"
              ></p>
            </div>
            <div
              class="rounded-2xl border border-gray-200 bg-white p-5 dark:border-white/5 dark:bg-[#211b2a]"
            >
              <p class="text-sm text-gray-500 dark:text-gray-400">
                در انتظار بررسی
              </p>
              <p
                class="mt-3 text-2xl font-black text-orange-500"
                x-text="orders.filter(o => o.status === 'pending').length.toLocaleString('fa-IR')"
              ></p>
            </div>
            <div
              class="rounded-2xl border border-gray-200 bg-white p-5 dark:border-white/5 dark:bg-[#211b2a]"
            >
              <p class="text-sm text-gray-500 dark:text-gray-400">تکمیل‌شده</p>
              <p
                class="mt-3 text-2xl font-black text-green-600 dark:text-green-400"
                x-text="orders.filter(o => o.status === 'completed').length.toLocaleString('fa-IR')"
              ></p>
            </div>
          </div>

          <div
            class="mb-6 rounded-2xl border border-gray-200 bg-white p-4 dark:border-white/5 dark:bg-[#211b2a] sm:p-5"
          >
            <div class="flex flex-col gap-3 sm:flex-row">
              <input
                x-model.trim="search"
                type="search"
                placeholder="جستجو با شماره سفارش یا نام مشتری..."
                class="min-w-0 flex-1 rounded-xl border border-gray-200 bg-gray-50 px-4 py-3 text-sm outline-none focus:border-[#4f8a67] dark:border-white/10 dark:bg-[#17131d]"
              />

              <select
                x-model="statusFilter"
                class="rounded-xl border border-gray-200 bg-gray-50 px-4 py-3 text-sm outline-none focus:border-[#4f8a67] dark:border-white/10 dark:bg-[#17131d] sm:w-52"
              >
                <option value="all">همه وضعیت‌ها</option>
                <option value="pending">در انتظار بررسی</option>
                <option value="processing">در حال آماده‌سازی</option>
                <option value="completed">تکمیل‌شده</option>
                <option value="cancelled">لغوشده</option>
              </select>
            </div>
          </div>

          <div
            class="overflow-hidden rounded-2xl border border-gray-200 bg-white dark:border-white/5 dark:bg-[#211b2a]"
          >
            <div class="overflow-x-auto">
              <table class="w-full min-w-[760px] text-right text-sm">
                <thead
                  class="border-b border-gray-200 bg-gray-50 text-gray-500 dark:border-white/5 dark:bg-white/[0.03] dark:text-gray-400"
                >
                  <tr>
                    <th class="px-5 py-4">شماره سفارش</th>
                    <th class="px-5 py-4">مشتری</th>
                    <th class="px-5 py-4">تاریخ</th>
                    <th class="px-5 py-4">مبلغ</th>
                    <th class="px-5 py-4">وضعیت</th>
                    <th class="px-5 py-4">تغییر وضعیت</th>
                  </tr>
                </thead>

                <tbody class="divide-y divide-gray-100 dark:divide-white/5">
                  <template x-for="order in filteredOrders" :key="order.id">
                    <tr class="hover:bg-gray-50 dark:hover:bg-white/[0.025]">
                      <td
                        class="whitespace-nowrap px-5 py-4 font-semibold"
                        x-text="order.id"
                      ></td>
                      <td
                        class="whitespace-nowrap px-5 py-4"
                        x-text="order.customer"
                      ></td>
                      <td
                        class="whitespace-nowrap px-5 py-4"
                        x-text="order.date"
                      ></td>
                      <td
                        class="whitespace-nowrap px-5 py-4 font-semibold"
                        x-text="formatPrice(order.total) + ' تومان'"
                      ></td>

                      <td class="whitespace-nowrap px-5 py-4">
                        <span
                          class="rounded-full px-3 py-1 text-xs font-semibold"
                          :class="statusClass(order.status)"
                          x-text="statusLabel(order.status)"
                        ></span>
                      </td>

                      <td class="px-5 py-4">
                        <select
                          :value="order.status"
                          @change="changeStatus(order.id, $event.target.value)"
                          :aria-label="'تغییر وضعیت سفارش ' + order.id"
                          class="rounded-lg border border-gray-200 bg-gray-50 px-3 py-2 text-xs outline-none focus:border-[#4f8a67] dark:border-white/10 dark:bg-[#17131d]"
                        >
                          <option value="pending">در انتظار بررسی</option>
                          <option value="processing">در حال آماده‌سازی</option>
                          <option value="completed">تکمیل‌شده</option>
                          <option value="cancelled">لغوشده</option>
                        </select>
                      </td>
                    </tr>
                  </template>

                  <tr x-show="filteredOrders.length === 0">
                    <td
                      colspan="6"
                      class="px-5 py-12 text-center text-gray-500 dark:text-gray-400"
                    >
                      سفارشی پیدا نشد.
                    </td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>

          <p class="mt-5 text-center text-xs text-gray-400">
            داشبورد فروشگاهی · مدیریت سفارش‌ها
          </p>
        </section>
      </main>

      <div
        x-show="notice"
        x-transition
        class="fixed bottom-4 left-4 z-[110] max-w-[calc(100%-2rem)] rounded-xl bg-[#211b2a] px-4 py-3 text-sm text-white shadow-xl"
        role="status"
        x-text="notice"
      ></div>
    </div>
  </body>
</html>
